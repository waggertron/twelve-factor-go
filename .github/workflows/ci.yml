name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
      - name: Verify
        run: ./scripts/check-twelve-factor.sh
      - name: Build container
        run: docker build -t twelve-factor-go:ci .
